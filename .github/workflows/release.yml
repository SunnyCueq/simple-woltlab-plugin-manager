name: Create Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.1'
        
    - name: Extract version from tag
      id: tag_version
      run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
      
    - name: Extract package name from package.xml
      id: package_name
      run: |
        PACKAGE_NAME=$(grep -oP 'name="\K[^"]+' package.xml | head -1)
        echo "PACKAGE_NAME=$PACKAGE_NAME" >> $GITHUB_OUTPUT
        
    - name: Create TAR archives
      run: |
        # Extract existing TARs if available
        if [ -f files.tar ]; then
          mkdir -p _extracted/files
          tar -xf files.tar -C _extracted/files/ || true
        fi
        if [ -f files_urlshort.tar ]; then
          mkdir -p _extracted/files_urlshort
          tar -xf files_urlshort.tar -C _extracted/files_urlshort/ || true
        fi
        if [ -f templates.tar ]; then
          mkdir -p _extracted/templates
          tar -xf templates.tar -C _extracted/templates/ || true
        fi
        if [ -f templates_urlshort.tar ]; then
          mkdir -p _extracted/templates_urlshort
          tar -xf templates_urlshort.tar -C _extracted/templates_urlshort/ || true
        fi
        
        # Recreate TARs
        if [ -d "_extracted/files" ] && [ "$(ls -A _extracted/files 2>/dev/null)" ]; then
          cd _extracted/files && tar -cf ../../files.tar * && cd ../..
        fi
        if [ -d "_extracted/files_urlshort" ] && [ "$(ls -A _extracted/files_urlshort 2>/dev/null)" ]; then
          cd _extracted/files_urlshort && tar -cf ../../files_urlshort.tar * && cd ../..
        fi
        if [ -d "_extracted/templates" ] && [ "$(ls -A _extracted/templates 2>/dev/null)" ]; then
          cd _extracted/templates && tar -cf ../../templates.tar * && cd ../..
        fi
        if [ -d "_extracted/templates_urlshort" ] && [ "$(ls -A _extracted/templates_urlshort 2>/dev/null)" ]; then
          cd _extracted/templates_urlshort && tar -cf ../../templates_urlshort.tar * && cd ../..
        fi
        
    - name: Create package
      run: |
        PACKAGE_NAME="${{ steps.package_name.outputs.PACKAGE_NAME }}"
        VERSION="${{ steps.tag_version.outputs.VERSION }}"
        PACKAGE_FILE="${PACKAGE_NAME}-${VERSION}.tar.gz"
        
        # Collect files
        TAR_FILES=()
        [ -f "files.tar" ] && TAR_FILES+=("files.tar")
        [ -f "files_urlshort.tar" ] && TAR_FILES+=("files_urlshort.tar")
        [ -f "templates.tar" ] && TAR_FILES+=("templates.tar")
        [ -f "templates_urlshort.tar" ] && TAR_FILES+=("templates_urlshort.tar")
        [ -f "acptemplates.tar" ] && TAR_FILES+=("acptemplates.tar")
        [ -f "acptemplates_urlshort.tar" ] && TAR_FILES+=("acptemplates_urlshort.tar")
        
        XML_FILES=()
        for xml_file in *.xml; do
          if [ -f "$xml_file" ]; then
            XML_FILES+=("$xml_file")
          fi
        done
        
        # Create package
        tar -czf "$PACKAGE_FILE" "${TAR_FILES[@]}" "${XML_FILES[@]}" language/ 2>/dev/null || \
        tar -czf "$PACKAGE_FILE" "${TAR_FILES[@]}" "${XML_FILES[@]}"
        
        echo "PACKAGE_FILE=$PACKAGE_FILE" >> $GITHUB_ENV
        
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: ${{ env.PACKAGE_FILE }}
        name: Version ${{ steps.tag_version.outputs.VERSION }}
        body: |
          ## Version ${{ steps.tag_version.outputs.VERSION }}
          
          See CHANGELOG.md for details.
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

