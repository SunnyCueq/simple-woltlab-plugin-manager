# MkDocs Material — Simple WoltLab Plugin Manager
# Style oriented on https://squidfunk.github.io/mkdocs-material/
# Source: tools/docs/  ·  Build: pip install -r requirements-docs.txt && mkdocs serve
# Site: https://benjarogit.github.io/simple-woltlab-plugin-manager/

site_name: SWPM · Dokumentation
site_description: Handbuch für den Simple WoltLab Plugin Manager — Build, Validierung, Produktlinie (vibe coding friendly)
site_url: https://benjarogit.github.io/simple-woltlab-plugin-manager/
site_author: SunnyCueq
repo_url: https://github.com/benjarogit/simple-woltlab-plugin-manager
repo_name: benjarogit/simple-woltlab-plugin-manager
edit_uri: edit/main/tools/docs/
docs_dir: tools/docs
site_dir: site
copyright: Copyright &copy; SWPM contributors — MIT License

# Brand colors (logo): coral #ff5b6e · cyan #22d3ee · indigo #6366f1 · lime #a3e635
# on night blue #0a0e18 — applied via stylesheets/extra.css (primary/accent = custom)

theme:
  name: material
  language: de
  logo: assets/swpm-mark.svg
  favicon: assets/favicon.png
  font:
    text: Roboto
    code: Roboto Mono
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil-outline
    view: material/eye-outline
    admonition:
      note: material/information-outline
      tip: material/fire
      warning: material/alert-outline
      success: material/check-circle-outline
  palette:
    # Auto → light → dark (like Material docs)
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Zum hellen Modus
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Zum dunklen Modus
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Systemeinstellung
  features:
    # navigation.instant incompatible with mkdocs-static-i18n language switcher
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - search.suggest
    - search.highlight
    - search.share
    - content.tabs.link
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - content.action.view
    - content.tooltips
    - toc.follow

plugins:
  - search:
      lang:
        - de
        - en
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      languages:
        - locale: de
          name: Deutsch
          default: true
          build: true
          site_name: SWPM · Dokumentation
          site_description: Handbuch für den Simple WoltLab Plugin Manager — Build, Validierung, Produktlinie (vibe coding friendly)
        - locale: en
          name: English
          build: true
          site_name: SWPM · Documentation
          site_description: Handbook for the Simple WoltLab Plugin Manager — build, validation, product line (vibe coding friendly)
          nav_translations:
            Start: Home
            Einstieg: Getting started
            Tools-Übersicht: Tools overview
            Plattformen: Platforms
            Build & Paket: Build & packaging
            Paket-Layout: Package layout
            Produktlinie: Product line
            ACP-Install: ACP install
            Docker-Rechte: Docker permissions
            Qualität & Richtlinien: Quality & guidelines
            Store-Checkliste: Store checklist
            Security-Checks: Security checks
            Language-XML: Language XML
            Template-Regeln: Template rules
            Logging: Logging

nav:
  - Start: index.md
  - Einstieg:
    - Tools-Übersicht: TOOLS-OVERVIEW.md
    - Plattformen: CROSS-PLATFORM.md
  - Build & Paket:
    - Paket-Layout: PACKAGE-LAYOUT.md
    - Produktlinie: PRODUCT-LINE.md
    - ACP-Install: ACP-PACKAGE-INSTALL.md
    - Docker-Rechte: DOCKER-APP-PERMISSIONS.md
  - Qualität & Richtlinien:
    - Store-Checkliste: PLUGIN-STORE-CHECKLIST.md
    - Security-Checks: SECURITY-CHECKS.md
    - Language-XML: LANGUAGE-XML.md
    - Template-Regeln: WOLTLAB-TEMPLATE-RULES.md
    - Logging: LOGGING.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - def_list
  - tables
  - footnotes
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/benjarogit/simple-woltlab-plugin-manager
      name: GitHub

exclude_docs: |
  logs/**
